name: Code Formatting

# Automatically checks and fixes code formatting using Prettier.
# The prettier-fix job commits formatting changes directly to PR branches.
#
# LIMITATIONS:
# - Cannot format PRs from forks due to GitHub security restrictions
# - Contributors from forks should run `bun run format` locally before pushing
# - Protected branches may block auto-commits; configure branch protection accordingly

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  prettier-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install

      - name: Run Prettier check
        run: bun run format:check

  prettier-fix:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install

      - name: Run Prettier format
        run: bun run format

      - name: Check for formatting changes
        id: verify_diff
        run: |
          git diff --exit-code || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Commit formatting changes
        if: steps.verify_diff.outputs.has_changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(format): apply Prettier formatting [skip ci]"
