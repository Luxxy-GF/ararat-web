name: Copilot Setup Steps

# This workflow prepares a dev environment for the Copilot Coding Agent
# with Incus + Caddy and a Next.js dev server, including TLS certs trusted by Incus.
#
# AUTOMATIC USAGE: GitHub Copilot agents automatically detect and use this workflow
# when assigned to issues or pull requests. The workflow must be on the default branch.
#
# ARCHITECTURE:
# - Incus API server runs on https://localhost:8443 with self-signed cert
# - Caddy proxy on http://localhost:8080 handles client TLS to Incus
# - Next.js dev server on http://localhost:3000
# - Browser connects to Caddy (no client cert needed)
# - Caddy presents client cert to Incus on behalf of browser/agent
#
# TROUBLESHOOTING:
# - Check Summary step output for service URLs and status
# - Workflow fails if Incus or Next.js don't start within 30 seconds
# - Containers (incus-dev, caddy-dev) are auto-cleaned on runner teardown

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    
    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      contents: read
    
    services:
      incus:
        image: ghcr.io/lxc/incus:6.19.1
        options: >-
          --privileged
          --name incus-svc
          -v /tmp/incus-data:/var/lib/incus
        ports:
          - 8443:8443
      

    env:
      NEXT_DEV_PORT: 3000
      INCUS_HTTPS_PORT: 8443
      CADDY_HTTP_PORT: 8080
      CADDY_ALT_PORT: 8081
      # Frontend expects a certificate path or env for TLS client auth
      ARARAT_CERT_DIR: ${{ github.workspace }}/.certs
      ARARAT_CERT_PEM: ${{ github.workspace }}/.certs/client.pem
      ARARAT_KEY_PEM: ${{ github.workspace }}/.certs/client.key
      # Allow origin matching the runner's IP; fallback to localhost
      DEV_ALLOWED_ORIGIN: http://localhost:8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            **/node_modules
          key: ${{ runner.os }}-bun-latest-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile || bun install

      - name: Create TLS certs directory
        run: |
          mkdir -p "$ARARAT_CERT_DIR"

      - name: Provision client TLS cert for Incus (self-signed)
        run: |
          set -euo pipefail
          # Generate a self-signed client cert/key for dev
          openssl req -x509 -newkey rsa:4096 \
            -keyout "$ARARAT_KEY_PEM" -out "$ARARAT_CERT_PEM" \
            -days 365 -nodes -subj "/CN=ararat-copilot-agent"
          chmod 600 "$ARARAT_KEY_PEM"
          chmod 644 "$ARARAT_CERT_PEM"

      - name: Write Caddyfile for dev
        run: |
          cat > "$PWD/.caddy.Caddyfile" <<'CADDY'
          :80 {
                  @api_v1 {
                          path /1.0
                          path /1.0/*
                  }
                  # Proxy API to Incus with client TLS so browser doesn't need a cert
                  handle @api_v1 {
                          reverse_proxy https://incus:8443 {
                                  transport http {
                                          tls {
                                                  client_certificate /etc/caddy/certs/client.pem /etc/caddy/certs/client.key
                                                  insecure_skip_verify
                                          }
                                  }
                          }
                  }
                  handle {
                          reverse_proxy http://localhost:3000
                  }
          }

          :81 {
                  @api_v1 {
                          path /1.0
                          path /1.0/*
                  }
                  handle @api_v1 {
                          reverse_proxy https://incus:8443 {
                                  transport http {
                                          tls_insecure_skip_verify
                                  }
                          }
                  }
                  handle {
                          root * /var/www/html
                          file_server
                          try_files {path}.html {path} /index.html
                  }
          }
          CADDY

      - name: Configure Incus service
        run: |
          set -euo pipefail
          # Wait for Incus daemon inside service container
          for i in {1..60}; do
            if docker exec incus-svc incus version >/dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! docker exec incus-svc incus version >/dev/null 2>&1; then
            echo "Incus service failed to become ready" >&2
            docker logs incus-svc || true
            exit 1
          fi

          # Configure Incus HTTPS and CORS
          docker exec incus-svc incus config set core.https_address "[::]:8443"
          docker exec incus-svc incus config set core.https_allowed_headers "Content-Type, Sec-Fetch-Site"
          docker exec incus-svc incus config set core.https_allowed_methods "GET, POST, PUT, DELETE, OPTIONS, HEAD"
          docker exec incus-svc incus config set core.https_allowed_origin "$DEV_ALLOWED_ORIGIN"

      - name: Trust Copilot client cert in Incus
        run: |
          set -euo pipefail
          # Add the agent's client certificate to Incus trust store inside the service
          docker cp "$ARARAT_CERT_PEM" incus-svc:/tmp/client.pem
          docker exec incus-svc sh -c "incus config trust add-cert /tmp/client.pem || true"

      - name: Export environment for the agent and app
        run: |
          {
            echo "ARARAT_CERT_PEM=$ARARAT_CERT_PEM"
            echo "ARARAT_KEY_PEM=$ARARAT_KEY_PEM"
            echo "NEXT_PUBLIC_INCUS_BASE=https://localhost:8443"
            echo "NEXT_PUBLIC_API_BASE=http://localhost:8080"
          } >> "$GITHUB_ENV"

      - name: Start Caddy with dev config
        run: |
          set -euo pipefail
          docker run -d --name caddy-dev \
            -p ${CADDY_HTTP_PORT}:80 -p ${CADDY_ALT_PORT}:81 \
            -v "$PWD/.caddy.Caddyfile":/etc/caddy/Caddyfile \
            -v "$ARARAT_CERT_DIR":/etc/caddy/certs:ro \
            caddy:2
          # Quick health check
          for i in {1..30}; do
            if curl -sSf "http://localhost:${CADDY_HTTP_PORT}" >/dev/null; then break; fi
            sleep 1
          done
          curl -sSf "http://localhost:${CADDY_HTTP_PORT}" >/dev/null

      - name: Install Playwright browsers
        run: |
          bunx playwright@latest install --with-deps

      - name: Summary
        run: |
          echo "✓ Dev environment ready"
          echo "  - Incus API: https://localhost:8443 (service)"
          echo "  - Caddy proxy: http://localhost:8080 (service)"
          echo "  - Client cert: $ARARAT_CERT_PEM"
          echo "  - Dependencies installed"
          echo ""
          echo "Copilot can now start the Next.js dev server and run tests"
