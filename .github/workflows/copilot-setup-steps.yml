name: Copilot Setup Steps

# This reusable workflow prepares a dev environment for the Copilot Coding Agent
# with Incus + Caddy and a Next.js dev server, including TLS certs trusted by Incus.
#
# AUTOMATIC USAGE: GitHub Copilot agents automatically detect and use this workflow
# when assigned to issues or pull requests. No manual triggering required.
#
# ARCHITECTURE:
# - Incus API server runs on https://localhost:8443 with self-signed cert
# - Caddy proxy on http://localhost:8080 handles client TLS to Incus
# - Next.js dev server on http://localhost:3000
# - Browser connects to Caddy (no client cert needed)
# - Caddy presents client cert to Incus on behalf of browser/agent
#
# TROUBLESHOOTING:
# - Check Summary step output for service URLs and status
# - Workflow fails if Incus or Next.js don't start within 30 seconds
# - Containers (incus-dev, caddy-dev) are auto-cleaned on runner teardown

on:
  workflow_call:
    # No inputs or secrets required; fully self-contained dev env

jobs:
  setup:
    name: Prepare Copilot Agent Environment
    runs-on: ubuntu-latest

    env:
      NEXT_DEV_PORT: 3000
      INCUS_HTTPS_PORT: 8443
      CADDY_HTTP_PORT: 8080
      CADDY_ALT_PORT: 8081
      # Frontend expects a certificate path or env for TLS client auth
      ARARAT_CERT_DIR: ${{ github.workspace }}/.certs
      ARARAT_CERT_PEM: ${{ github.workspace }}/.certs/client.pem
      ARARAT_KEY_PEM: ${{ github.workspace }}/.certs/client.key
      # Allow origin matching the runner's IP; fallback to localhost
      DEV_ALLOWED_ORIGIN: http://localhost:8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            **/node_modules
          key: ${{ runner.os }}-bun-latest-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile || bun install

      - name: Create TLS certs directory
        run: |
          mkdir -p "$ARARAT_CERT_DIR"

      - name: Provision client TLS cert for Incus (self-signed)
        shell: bash
        run: |
          set -euo pipefail
          # Generate a self-signed client cert/key for dev
          openssl req -x509 -newkey rsa:4096 \
            -keyout "$ARARAT_KEY_PEM" -out "$ARARAT_CERT_PEM" \
            -days 365 -nodes -subj "/CN=ararat-copilot-agent"
          chmod 600 "$ARARAT_KEY_PEM"
          chmod 644 "$ARARAT_CERT_PEM"

      - name: Write Caddyfile for dev
        shell: bash
        run: |
          cat > "$PWD/.caddy.Caddyfile" <<'CADDY'
          :${CADDY_HTTP_PORT} {
                  @api_v1 {
                          path /1.0
                          path /1.0/*
                  }
                  # Proxy API to Incus with client TLS so browser doesn't need a cert
                  handle @api_v1 {
                          reverse_proxy https://localhost:${INCUS_HTTPS_PORT} {
                                  transport http {
                                          tls {
                                                  client_certificate /etc/caddy/certs/client.pem /etc/caddy/certs/client.key
                                                  insecure_skip_verify
                                          }
                                  }
                          }
                  }
                  handle {
                          reverse_proxy http://localhost:${NEXT_DEV_PORT}
                  }
          }

          :${CADDY_ALT_PORT} {
                  @api_v1 {
                          path /1.0
                          path /1.0/*
                  }
                  handle @api_v1 {
                          reverse_proxy https://localhost:${INCUS_HTTPS_PORT} {
                                  transport http {
                                          tls_insecure_skip_verify
                                  }
                          }
                  }
                  handle {
                          root * /var/www/html
                          file_server
                          try_files {path}.html {path} /index.html
                  }
          }
          CADDY

      - name: Start Incus daemon in Docker (dev)
        shell: bash
        run: |
          set -euo pipefail
          # Pull Incus image
          docker pull ghcr.io/lxc/incus:latest || true
          # Create a minimal Incus data dir
          mkdir -p "$PWD/.incus"
          # Start Incus in privileged container for dev, exposing HTTPS
          docker run -d --name incus-dev \
            --privileged \
            -p ${INCUS_HTTPS_PORT}:8443 \
            -v "$PWD/.incus":/var/lib/incus \
            ghcr.io/lxc/incus:latest

          # Wait for Incus to be ready
          for i in {1..30}; do
            if docker exec incus-dev incus version >/dev/null 2>&1; then break; fi
            sleep 1
          done
          
          # Check if Incus started successfully
          if ! docker exec incus-dev incus version >/dev/null 2>&1; then
            echo "Incus daemon failed to start"
            exit 1
          fi

          # Configure Incus HTTPS and CORS
          docker exec incus-dev incus config set core.https_address "[::]:8443"
          docker exec incus-dev incus config set core.https_allowed_headers "Content-Type, Sec-Fetch-Site"
          docker exec incus-dev incus config set core.https_allowed_methods "GET, POST, PUT, DELETE, OPTIONS, HEAD"
          docker exec incus-dev incus config set core.https_allowed_origin "$DEV_ALLOWED_ORIGIN"

      - name: Trust Copilot client cert in Incus (dev)
        shell: bash
        run: |
          set -euo pipefail
          # Add the agent's client certificate to Incus trust store
          docker cp "$ARARAT_CERT_PEM" incus-dev:/tmp/client.pem
          docker exec incus-dev sh -c "incus config trust add-cert /tmp/client.pem || true"

      - name: Start Caddy with dev config
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name caddy-dev \
            -p ${CADDY_HTTP_PORT}:80 -p ${CADDY_ALT_PORT}:81 \
            -v "$PWD/.caddy.Caddyfile":/etc/caddy/Caddyfile \
            -v "$ARARAT_CERT_DIR":/etc/caddy/certs:ro \
            caddy:2

      - name: Export environment for the agent and app
        shell: bash
        run: |
          {
            echo "ARARAT_CERT_PEM=$ARARAT_CERT_PEM"
            echo "ARARAT_KEY_PEM=$ARARAT_KEY_PEM"
            echo "NEXT_PUBLIC_INCUS_BASE=https://localhost:8443"
            echo "NEXT_PUBLIC_API_BASE=http://localhost:8080"
          } >> "$GITHUB_ENV"

      - name: Start Next.js dev server
        shell: bash
        run: |
          # Run in background so the workflow continues; agent will connect to it
          nohup bun run dev -- --port "$NEXT_DEV_PORT" >/dev/null 2>&1 &
          # Quick health check
          for i in {1..30}; do
            if curl -sSf "http://localhost:${NEXT_DEV_PORT}" >/dev/null; then break; fi
            sleep 1
          done
          
          # Check if Next.js started successfully
          if ! curl -sSf "http://localhost:${NEXT_DEV_PORT}" >/dev/null; then
            echo "Next.js dev server failed to start"
            exit 1
          fi

      - name: Install Playwright browsers
        shell: bash
        run: |
          bunx playwright@latest install --with-deps

      - name: Summary
        run: |
          echo "Dev env ready: Next.js on http://localhost:${NEXT_DEV_PORT}"
          echo "Incus HTTPS on https://localhost:${INCUS_HTTPS_PORT}"
          echo "Caddy proxy on http://localhost:${CADDY_HTTP_PORT}"
